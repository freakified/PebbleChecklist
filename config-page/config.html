<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Checklist</title>
  <link rel="stylesheet" href="config.css">
</head>

<body>
  <div class="container">
    <div class="submit-section">
      <h1 class="title">Checklist</h1>
      <div class="menu-container">
        <button class="menu-btn" onclick="toggleMenu(event)" aria-label="More options" aria-haspopup="menu" aria-expanded="false" id="menu_btn">•••</button>
        <div class="menu-items" id="menu_items" role="menu">
          <button role="menuitem" onclick="clearCompleted(); closeMenu()">Clear Completed</button>
          <hr class="menu-separator">
          <button role="menuitem" onclick="exportCSV(); closeMenu()">Export</button>
          <button role="menuitem" onclick="showImport(); closeMenu()">Import</button>
        </div>
      </div>
      <button class="submit-btn" onclick="submitData()">Save to Watch</button>
    </div>
    <div class="items-section">
      <div class="items-list" id="items_list"></div>
      <div class="add-row">
        <input type="text" class="new-item-input" id="new_item_input" placeholder="Add new item...">
        <button class="add-btn" id="add_btn" onclick="addItem()" disabled aria-label="Add item">&#xFF0B;</button>
      </div>
    </div>
    <div id="io_section" style="display:none;">
      <textarea id="csv_output" class="io-textarea"></textarea>
      <div id="apply_row" style="display:none; margin-top: 8px; text-align: right;">
        <button class="submit-btn" onclick="applyImport()">Apply Import</button>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
</body>

</html>
