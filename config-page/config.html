<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Checklist</title>
  <link rel="stylesheet" href="config.css">
</head>

<body>
  <div class="container">
    <div class="submit-section">
      <h1 class="title">Checklist</h1>
      <button class="menu-btn" onclick="openSettings()" aria-label="Settings" aria-haspopup="dialog">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
        </svg>
      </button>
      <div class="menu-container">
        <button class="menu-btn" onclick="toggleMenu(event)" aria-label="More options" aria-haspopup="menu" aria-expanded="false" id="menu_btn">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
            <circle cx="3" cy="8" r="1.6"/>
            <circle cx="8" cy="8" r="1.6"/>
            <circle cx="13" cy="8" r="1.6"/>
          </svg>
        </button>
        <div class="menu-items" id="menu_items" role="menu">
          <button role="menuitem" onclick="clearCompleted(); closeMenu()">Clear completed</button>
          <hr class="menu-separator">
          <button role="menuitem" onclick="exportCSV(); closeMenu()">Export</button>
          <button role="menuitem" onclick="showImport(); closeMenu()">Import</button>
        </div>
      </div>
      <button class="submit-btn" onclick="submitData()">Save</button>
    </div>
    <div class="items-section">
      <div class="items-list" id="items_list"></div>
      <div class="add-row">
        <input type="text" class="new-item-input" id="new_item_input" placeholder="Add new item...">
        <button class="add-btn" id="add_btn" onclick="addItem()" disabled aria-label="Add item">&#xFF0B;</button>
      </div>
    </div>
    <div id="io_section" style="display:none;">
      <textarea id="csv_output" class="io-textarea"></textarea>
      <div id="apply_row" style="display:none; margin-top: 8px; text-align: right;">
        <button class="submit-btn" onclick="applyImport()">Apply import</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="settings_modal" style="display:none;" onclick="closeSettings(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
      <h2 class="section-header">Settings</h2>
      <label class="setting-row">
        <input type="checkbox" id="setting_show_voice">
        <span class="checkbox-box"></span>
        <span class="setting-label">Show voice input button</span>
      </label>
      <label class="setting-row">
        <input type="checkbox" id="setting_wrap_around">
        <span class="checkbox-box"></span>
        <span class="setting-label">Wrap-around scrolling</span>
      </label>
      <label class="setting-row">
        <input type="checkbox" id="setting_larger_font">
        <span class="checkbox-box"></span>
        <span class="setting-label">Use larger fonts</span>
      </label>
      <label class="setting-row">
        <input type="checkbox" id="setting_move_checked">
        <span class="checkbox-box"></span>
        <span class="setting-label">Move checked items to the bottom of the list</span>
      </label>
      <button class="submit-btn" onclick="closeSettings()">Done</button>
    </div>
  </div>
  <script src="config.js"></script>
</body>

</html>
